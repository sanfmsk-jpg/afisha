{% macro card(e, favs, compact=False) %}
<article class="card" data-id="{{ e.id }}">
  <a class="card__cover" href="{{ url_for('event_page', event_id=e.id) }}"
     style="--accent: {{ e.accent }}" aria-hidden="true" tabindex="-1">
    <span class="card__cat">{{ e.category }}</span>
    <span class="card__day">{{ e.starts_at[8:10] }}<small>{{ e.starts_at|rudate(with_time=False) }}</small></span>
  </a>
  <div class="card__body">
    <h3 class="card__title"><a href="{{ url_for('event_page', event_id=e.id) }}">{{ e.title }}</a></h3>
    <p class="card__meta">{{ e.starts_at|rudate }} &middot; {{ e.city }}</p>
    <p class="card__venue">{{ e.venue }}</p>
    {% if not compact %}<p class="card__sum">{{ e.summary }}</p>{% endif %}
    <div class="card__foot">
      <span class="price {% if e.is_free %}price--free{% endif %}">{{ e|price }}</span>
      <button class="fav {% if e.id in favs %}is-on{% endif %}"
              data-event="{{ e.id }}" type="button"
              aria-pressed="{{ 'true' if e.id in favs else 'false' }}">
        <span class="fav__ico" aria-hidden="true">&#10003;</span>
        <span class="fav__label">Пойду</span>
        <span class="fav__count">{{ e.fav_count }}</span>
        <span class="visually-hidden">: {{ e.title }}</span>
      </button>
    </div>
  </div>
</article>
{% endmacro %}
